# Roda os testes a cada push. Nos commits RED o resultado é ❌ de propósito
# (o teste novo ainda falha); nos commits GREEN e REFACTOR tem que ser ✅.
name: Testes

on:
  push:
  pull_request:

jobs:
  testes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
          cache: maven
      - name: Testes de unidade, integração e cobertura
        run: mvn -B verify

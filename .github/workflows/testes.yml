# Roda os testes a cada push, no Linux e no Windows, pelo Maven Wrapper.
# Nos commits RED o resultado é ❌ de propósito (o teste novo ainda falha);
# nos commits GREEN e REFACTOR tem que ser ✅.
name: Testes

on:
  push:
  pull_request:

jobs:
  testes:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
          cache: maven
      - name: Testes de unidade, integração e cobertura (Linux)
        if: runner.os != 'Windows'
        run: ./mvnw -B verify
      - name: Testes de unidade, integração e cobertura (Windows)
        if: runner.os == 'Windows'
        run: .\mvnw.cmd -B verify
